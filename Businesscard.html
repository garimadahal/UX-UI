<!DOCTYPE html>
<html lang="en">
<head>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(
        135deg,
        #0f172a,
        #1e293b,
        #334155
    );
    padding:30px;
}

.container{
    display:flex;
    gap:40px;
    flex-wrap:wrap;
    justify-content:center;
}

.card{
    position:relative;
    width:420px;
    height:240px;
    border-radius:24px;
    overflow:hidden;
    backdrop-filter:blur(20px);
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.2);
    box-shadow:
    0 20px 50px rgba(0,0,0,0.3);
    transition:.4s;
}

.card:hover{
    transform:translateY(-8px);
}

.card-bg{
    position:absolute;
    width:250px;
    height:250px;
    border-radius:50%;
    background:linear-gradient(
        135deg,
        #06b6d4,
        #3b82f6
    );
    top:-120px;
    right:-100px;
    opacity:.8;
}

.logo{
    position:absolute;
    top:20px;
    right:25px;
    width:55px;
    height:55px;
    border-radius:15px;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    font-weight:700;
    color:#2563eb;
}

.content{
    position:relative;
    z-index:2;
    color:white;
    padding:30px;
}

.content h1{
    font-size:28px;
    font-weight:700;
}

.content h3{
    margin-top:5px;
    color:#cbd5e1;
    font-weight:400;
}

.divider{
    width:60px;
    height:4px;
    background:#38bdf8;
    margin:15px 0;
    border-radius:10px;
}

.info p{
    margin:8px 0;
    font-size:14px;
}

.editor{
    width:320px;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,0.1);
}

.editor h2{
    margin-bottom:20px;
    color:#1e293b;
}

.editor input{
    width:100%;
    padding:12px;
    margin-bottom:12px;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
}

.editor input:focus{
    border-color:#3b82f6;
}

.editor button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    font-size:16px;
    transition:.3s;
}

.editor button:hover{
    background:#1d4ed8;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UX/UI Business Card</title>
<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">

    <div class="card">

        <div class="card-bg"></div>

        <div class="logo">
            <span>G</span>
        </div>

        <div class="content">
            <h1 id="name">Garima Dahal</h1>
            <h3 id="position">UX/UI Designer</h3>

            <div class="divider"></div>

            <div class="info">
                <p>📞 <span id="phone">+977 9800000000</span></p>
                <p>📧 <span id="email">hello@gdevs.com</span></p>
                <p>🌐 <span id="website">www.gdevs.com</span></p>
                <p>📍 Kathmandu, Nepal</p>
            </div>
        </div>

    </div>

    <div class="editor">
        <h2>Edit Card</h2>

        <input type="text" id="inputName" placeholder="Full Name">
        <input type="text" id="inputPosition" placeholder="Position">
        <input type="text" id="inputPhone" placeholder="Phone">
        <input type="email" id="inputEmail" placeholder="Email">
        <input type="text" id="inputWebsite" placeholder="Website">

        <button onclick="updateCard()">Update Card</button>
    </div>

</div>

<script> function updateCard(){

    let name = document.getElementById("inputName").value;
    let position = document.getElementById("inputPosition").value;
    let phone = document.getElementById("inputPhone").value;
    let email = document.getElementById("inputEmail").value;
    let website = document.getElementById("inputWebsite").value;

    if(name)
        document.getElementById("name").innerText = name;

    if(position)
        document.getElementById("position").innerText = position;

    if(phone)
        document.getElementById("phone").innerText = phone;

    if(email)
        document.getElementById("email").innerText = email;

    if(website)
        document.getElementById("website").innerText = website;
}</script>

</body>
</html>

</body>
</html>
