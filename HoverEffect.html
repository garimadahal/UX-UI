<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern UX/UI Business Card</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(135deg,#0f172a,#1e293b,#111827);
    overflow:hidden;
}

.card{
    position:relative;
    width:420px;
    height:260px;
    border-radius:25px;
    overflow:hidden;
    cursor:pointer;

    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.15);

    box-shadow:
    0 20px 40px rgba(0,0,0,0.4);

    transition:
    transform .15s ease,
    box-shadow .4s ease;

    transform-style:preserve-3d;
}

.card:hover{
    box-shadow:
    0 25px 50px rgba(59,130,246,.35),
    0 0 40px rgba(59,130,246,.2);
}

.glow{
    position:absolute;
    width:250px;
    height:250px;
    background:linear-gradient(
    135deg,
    #00e5ff,
    #3b82f6,
    #7c3aed);
    border-radius:50%;
    top:-130px;
    right:-90px;
    opacity:.8;
    filter:blur(20px);
    animation:float 5s ease-in-out infinite;
}

@keyframes float{
    0%,100%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(20px);
    }
}

.shine{
    position:absolute;
    top:-100%;
    left:-100%;
    width:200%;
    height:200%;
    background:
    linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,.25),
    transparent);

    transform:rotate(25deg);
    transition:.8s;
}

.card:hover .shine{
    left:100%;
}

.logo{
    position:absolute;
    top:25px;
    right:25px;

    width:60px;
    height:60px;

    border-radius:15px;

    background:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:26px;
    font-weight:800;

    color:#2563eb;

    transform:translateZ(40px);
}

.content{
    position:relative;
    z-index:10;
    padding:30px;
    color:white;
}

.name{
    font-size:30px;
    font-weight:700;
    transform:translateZ(30px);
}

.role{
    color:#cbd5e1;
    margin-top:5px;
    font-weight:400;
    transform:translateZ(25px);
}

.line{
    width:70px;
    height:4px;
    background:#38bdf8;
    margin:15px 0;
    border-radius:10px;
    transform:translateZ(20px);
}

.info{
    transform:translateZ(15px);
}

.info p{
    margin:8px 0;
    font-size:14px;
    transition:.3s;
}

.info p:hover{
    transform:translateX(8px);
    color:#38bdf8;
}

.socials{
    position:absolute;
    bottom:20px;
    right:20px;
    display:flex;
    gap:10px;
}

.social{
    width:35px;
    height:35px;
    border-radius:50%;
    background:rgba(255,255,255,.12);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    transition:.4s;
}

.social:hover{
    transform:
    translateY(-8px)
    scale(1.15);

    background:#3b82f6;
}

.particles span{
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    background:white;
    opacity:.5;
    animation:particle 8s linear infinite;
}

.particles span:nth-child(1){
    left:20%;
    top:80%;
}

.particles span:nth-child(2){
    left:60%;
    top:90%;
}

.particles span:nth-child(3){
    left:80%;
    top:70%;
}

@keyframes particle{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(-120px);
    }
}
</style>
</head>
<body>

<div class="card" id="card">

    <div class="glow"></div>
    <div class="shine"></div>

    <div class="particles">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="logo">G</div>

    <div class="content">

        <h1 class="name">Garima Dahal</h1>
        <div class="role">UX/UI Designer</div>

        <div class="line"></div>

        <div class="info">
            <p>📞 +977 9800000000</p>
            <p>✉ hello@gdevs.com</p>
            <p>🌐 www.gdevs.com</p>
            <p>📍 Kathmandu, Nepal</p>
        </div>

    </div>

    <div class="socials">
        <div class="social">f</div>
        <div class="social">in</div>
        <div class="social">𝕏</div>
    </div>

</div>

<script>

const card = document.getElementById("card");

card.addEventListener("mousemove",(e)=>{

    const rect = card.getBoundingClientRect();

    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    const centerX = rect.width/2;
    const centerY = rect.height/2;

    const rotateY = (x-centerX)/18;
    const rotateX = -(y-centerY)/18;

    card.style.transform =
    `perspective(1000px)
     rotateX(${rotateX}deg)
     rotateY(${rotateY}deg)
     scale(1.05)`;

});

card.addEventListener("mouseleave",()=>{

    card.style.transform =
    "perspective(1000px) rotateX(0) rotateY(0) scale(1)";

});

</script>

</body>
</html>
